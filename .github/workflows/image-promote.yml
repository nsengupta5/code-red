name: Promote Docker Images

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: "Git SHA tag to promote"
        required: true
      target_tag:
        description: "Target tag (e.g. prod)"
        required: true
        default: "prod"

permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: project-990b8649-da36-4d4c-9d9
  REGION: us-central1

jobs:
  promote:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app_name: 'dataflow'
            repository: 'dataflow-images'
            image_name: 'dataflow-app'
          - app_name: 'naive'
            repository: 'naive-images'
            image_name: 'naive-app'

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/258083003066/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: ci-artifact-publisher@project-990b8649-da36-4d4c-9d9.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for GAR
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Promote image for ${{ matrix.app_name }}
        run: |
          SRC_IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ matrix.repository }}/${{ matrix.image_name }}:${{ inputs.image_sha }}"
          DEST_IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ matrix.repository }}/${{ matrix.image_name }}:${{ inputs.target_tag }}"

          echo "Pulling source image: $SRC_IMAGE"
          docker pull "$SRC_IMAGE"

          echo "Tagging for promotion to: $DEST_IMAGE"
          docker tag "$SRC_IMAGE" "$DEST_IMAGE"

          echo "Pushing promoted image: $DEST_IMAGE"
          docker push "$DEST_IMAGE"

      - name: Output promoted image
        run: |
          echo "Successfully promoted ${{ matrix.app_name }} image to tag: ${{ inputs.target_tag }}"