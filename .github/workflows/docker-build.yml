name: Build & Push Docker Images

on:
  pull_request:
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'Dockerfile.naive'
      - '.github/workflows/docker-build.yml'
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'Dockerfile.naive'
      - '.github/workflows/docker-build.yml'

permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: project-990b8649-da36-4d4c-9d9
  REGION: us-central1
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app_name: 'dataflow'
            dockerfile: 'Dockerfile'
            repository: 'dataflow-images'
            image_name: 'dataflow-app'
          - app_name: 'naive'
            dockerfile: 'Dockerfile.naive'
            repository: 'naive-images'
            image_name: 'naive-app' # This is the image name used in the Airflow DAG

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/258083003066/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: ci-artifact-publisher@project-990b8649-da36-4d4c-9d9.iam.gserviceaccount.com

      - name: Setup gcloud
        if: github.event_name == 'push'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for GAR
        if: github.event_name == 'push'
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image for ${{ matrix.app_name }}
        run: |
          docker build \
            --file ${{ matrix.dockerfile }} \
            --tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ matrix.repository }}/${{ matrix.image_name }}:${{ env.IMAGE_TAG }} \
            .

      - name: Push Docker image for ${{ matrix.app_name }}
        if: github.event_name == 'push'
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ matrix.repository }}/${{ matrix.image_name }}:${{ env.IMAGE_TAG }}

      - name: Output image reference for ${{ matrix.app_name }}
        run: |
          echo "Pushed Image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ matrix.repository }}/${{ matrix.image_name }}:${{ env.IMAGE_TAG }}"